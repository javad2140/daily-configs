name: Update data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray-knife
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/xk"
          cd "$RUNNER_TEMP/xk"
          curl -fsSL -o xk.zip "https://github.com/lilendian0x00/xray-knife/releases/download/v11.1.0/Xray-knife-linux-64.zip"
          unzip -o xk.zip
          BIN=$(find . -type f -iname "xray-knife*" ! -name "*.zip" | head -n 1)
          chmod +x "$BIN"
          echo "XRAY_KNIFE_BIN=$(realpath "$BIN")" >> "$GITHUB_ENV"

      - name: Collect and test
        run: python collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data"
            git pull --rebase
            git push
          fi
